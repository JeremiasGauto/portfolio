# Revisa cada Pull Request antes de mergear: JSON válido y que
# existan los archivos de imágenes/videos referenciados.
name: Validar contenido

on:
  pull_request:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar profile.json y projects.json
        run: python scripts/validate.py
